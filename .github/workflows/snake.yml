name: Generate Monochrome Contribution Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Generate Pure Monochrome Contribution Grid Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AlkaidSTART
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#09090b&color_dots=#f4f4f5,#d4d4d8,#a1a1aa,#52525b,#09090b
            dist/github-contribution-grid-snake-dark.svg?color_snake=#fafafa&color_dots=#16161b,#35353f,#656573,#a4a4b0,#fafafa

      - name: Deploy Monochrome Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
