name: Generate GitHub Contribution Snake

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Grid Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AlkaidSTART
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ea580c&color_dots=#f4f4f5,#fed7aa,#fb923c,#ea580c,#9a3412
            dist/github-contribution-grid-snake-dark.svg?color_snake=#fb923c&color_dots=#09090b,#431407,#9a3412,#ea580c,#fdba74

      - name: Deploy Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
