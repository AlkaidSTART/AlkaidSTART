name: Sync Profile Telemetry & Particle Assets

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "profile.config.json"
      - "scripts/**"

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync GitHub GraphQL, Blog & Regenerate Monochrome Particle SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/sync_profile.py

      - name: Commit & Push Updated Telemetry and Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "AlkaidSTART-Telemetry-Bot"
          git add README.md assets/
          git diff --cached --quiet || (git commit -m "chore(telemetry): sync live metrics, writing & particle assets [skip ci]" && git push)
