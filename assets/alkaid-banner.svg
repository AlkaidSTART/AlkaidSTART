<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Obsidian with Warm Ember Undertone -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a0502"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Warm Orange Star Glow Gradients -->
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fed7aa" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Alkaid Core Radiance: High-Luminosity Amber-Orange Supernova Glow -->
    <radialGradient id="alkaid-natural-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffedd5" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#fb923c" stop-opacity="0.7"/>
      <stop offset="75%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Constellation Lines: Warm Golden Sunset & Ember Silver -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Filter for Gentle Warm Bloom Glow -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .line-pulse { animation: lineGlow 4.5s infinite ease-in-out; }

      @keyframes lineGlow {
        0%, 100% { stroke-opacity: 0.38; }
        50% { stroke-opacity: 0.82; }
      }

      .text-coord {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 10px;
        letter-spacing: 1.5px;
        fill: #78716c;
      }
      .star-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 9px;
        fill: #a8a29e;
      }
      .alkaid-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 9.5px;
        font-weight: 600;
        fill: #fb923c;
      }
    </style>
  </defs>

  <!-- Canvas Surface (Deep Obsidian Black with Warm Ember Frame) -->
  <rect width="840" height="260" rx="16" fill="url(#bg-grad)"/>
  <rect width="840" height="260" rx="16" fill="none" stroke="#2b1a11" stroke-width="1.2"/>

  <!-- Subtle Coordinate Grid Lines (Warm Ember tint) -->
  <g stroke="#f97316" stroke-opacity="0.04" stroke-width="0.8" stroke-dasharray="3 6">
    <line x1="40" y1="65" x2="800" y2="65"/>
    <line x1="40" y1="130" x2="800" y2="130"/>
    <line x1="40" y1="195" x2="800" y2="195"/>
    <line x1="200" y1="20" x2="200" y2="240"/>
    <line x1="420" y1="20" x2="420" y2="240"/>
    <line x1="640" y1="20" x2="640" y2="240"/>
  </g>

  <!-- Ambient Cosmic Dust / Static Deep Space Stars (静止恒星微光，无晃动) -->
  <g opacity="0.45">
    <circle cx="85" cy="45" r="0.9" fill="#fed7aa"/>
    <circle cx="160" cy="190" r="1" fill="#ffffff"/>
    <circle cx="230" cy="70" r="0.8" fill="#fed7aa"/>
    <circle cx="310" cy="220" r="0.9" fill="#ffedd5"/>
    <circle cx="370" cy="40" r="0.8" fill="#ffffff"/>
    <circle cx="500" cy="210" r="0.9" fill="#fed7aa"/>
    <circle cx="610" cy="50" r="1" fill="#ffffff"/>
    <circle cx="770" cy="85" r="0.8" fill="#ffedd5"/>
    <circle cx="790" cy="205" r="0.9" fill="#ffffff"/>
    <circle cx="110" cy="130" r="0.7" fill="#fed7aa"/>
    <circle cx="480" cy="75" r="0.8" fill="#ffffff"/>
  </g>

  <!-- Big Dipper (北斗七星) Constellation Lines (Warm Sunset Ember) -->
  <g class="line-pulse" stroke="url(#line-grad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#bloom)">
    <!-- Spoon Bowl -->
    <line x1="130" y1="75" x2="140" y2="165"/>
    <line x1="140" y1="165" x2="270" y2="175"/>
    <line x1="270" y1="175" x2="285" y2="100"/>
    <line x1="285" y1="100" x2="130" y2="75"/>
    <!-- Spoon Handle -->
    <line x1="285" y1="100" x2="420" y2="85"/>
    <line x1="420" y1="85" x2="555" y2="105"/>
    <line x1="555" y1="105" x2="705" y2="165"/>
  </g>

  <!-- STARS OF THE BIG DIPPER (北斗七星 · 暖橙与琥珀星芒体系) -->
  <g filter="url(#bloom)">
    <!-- 1. Dubhe 天枢 -->
    <circle cx="130" cy="75" r="13" fill="url(#star-glow)"/>
    <circle cx="130" cy="75" r="3" fill="#ffffff"/>
    <text x="130" y="60" text-anchor="middle" class="star-label">天枢 · Dubhe</text>

    <!-- 2. Merak 天璇 -->
    <circle cx="140" cy="165" r="12" fill="url(#star-glow)"/>
    <circle cx="140" cy="165" r="2.8" fill="#ffffff"/>
    <text x="140" y="185" text-anchor="middle" class="star-label">天璇 · Merak</text>

    <!-- 3. Phecda 天玑 -->
    <circle cx="270" cy="175" r="12" fill="url(#star-glow)"/>
    <circle cx="270" cy="175" r="2.8" fill="#ffffff"/>
    <text x="270" y="195" text-anchor="middle" class="star-label">天玑 · Phecda</text>

    <!-- 4. Megrez 天权 -->
    <circle cx="285" cy="100" r="11" fill="url(#star-glow)"/>
    <circle cx="285" cy="100" r="2.6" fill="#ffffff"/>
    <text x="285" y="85" text-anchor="middle" class="star-label">天权 · Megrez</text>

    <!-- 5. Alioth 玉衡 -->
    <circle cx="420" cy="85" r="14" fill="url(#star-glow)"/>
    <circle cx="420" cy="85" r="3.2" fill="#ffffff"/>
    <text x="420" y="70" text-anchor="middle" class="star-label">玉衡 · Alioth</text>

    <!-- 6. Mizar 开阳 -->
    <circle cx="555" cy="105" r="14" fill="url(#star-glow)"/>
    <circle cx="555" cy="105" r="3.2" fill="#ffffff"/>
    <text x="555" y="90" text-anchor="middle" class="star-label">开阳 · Mizar</text>

    <!-- 7. Alkaid 摇光 (北斗之末 · 破军之光 · 核心暖橙恒星) -->
    <circle cx="705" cy="165" r="18" fill="url(#alkaid-natural-glow)"/>
    <circle cx="705" cy="165" r="6" fill="#fb923c" opacity="0.4"/>
    <circle cx="705" cy="165" r="3.6" fill="#ffffff"/>
    <text x="705" y="187" text-anchor="middle" class="alkaid-label">摇光 · Alkaid</text>
  </g>

  <!-- Subtle Astronomy Reference -->
  <g transform="translate(42, 226)">
    <text x="760" y="0" class="text-coord" text-anchor="end">URSA MAJOR · η UMa</text>
  </g>
</svg>
