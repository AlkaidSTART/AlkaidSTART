<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <!-- Studio Obsidian Base -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="55%" stop-color="#090807"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>

    <!-- Atmospheric Tungsten Light Leak (Oryzo / Lusion Studio Lighting) -->
    <radialGradient id="ambient-tungsten" cx="76%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.16"/>
      <stop offset="35%" stop-color="#9a3412" stop-opacity="0.07"/>
      <stop offset="70%" stop-color="#431407" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Subtle Top-Left Rim Light -->
    <radialGradient id="rim-light" cx="15%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Alkaid Primary Star Core Glow -->
    <radialGradient id="alkaid-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="22%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Secondary Star Glow -->
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fdba74" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Precision Metallic Line Gradient -->
    <linearGradient id="constellation-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#fb923c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Top Specular Edge -->
    <linearGradient id="top-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="70%" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Editorial Title Metallic Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>

    <filter id="soft-bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-meta {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 2.2px;
        fill: #71717a;
      }
      .mono-accent {
        font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 2.2px;
        fill: #fb923c;
        font-weight: 600;
      }
      .hero-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -1.4px;
        fill: url(#title-grad);
      }
      .hero-title-accent {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
        font-size: 42px;
        font-weight: 300;
        font-style: italic;
        letter-spacing: -1px;
        fill: #fb923c;
      }
      .hero-zh {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        letter-spacing: 0.4px;
        fill: #d4d4d8;
      }
      .hero-en {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        letter-spacing: 0.2px;
        fill: #71717a;
      }
      .spec-index {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        font-size: 9.5px;
        letter-spacing: 1.5px;
        fill: #fb923c;
      }
      .spec-label {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.6px;
        fill: #e4e4e7;
      }
      .star-tag {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        font-size: 8.5px;
        letter-spacing: 1.2px;
        fill: #71717a;
      }
      .alkaid-tag {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #fdba74;
      }
      .orbit-slow {
        transform-origin: 760px 178px;
        animation: pulseOpacity 6s ease-in-out infinite;
      }
      .signal-dot {
        animation: signalPulse 3s ease-in-out infinite;
      }
      @keyframes pulseOpacity {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }
      @keyframes signalPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="1000" height="380" rx="14" fill="url(#bg-base)"/>
  <rect width="1000" height="380" rx="14" fill="url(#ambient-tungsten)"/>
  <rect width="1000" height="380" rx="14" fill="url(#rim-light)"/>
  <rect x="0.5" y="0.5" width="999" height="379" rx="13.5" fill="none" stroke="#18181b" stroke-width="1"/>
  <line x1="24" y1="1" x2="976" y2="1" stroke="url(#top-specular)" stroke-width="1"/>

  <!-- Architectural Swiss Grid & Hairlines -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="0" y1="48" x2="1000" y2="48"/>
    <line x1="0" y1="312" x2="1000" y2="312"/>
    <line x1="560" y1="48" x2="560" y2="312"/>
    <line x1="760" y1="48" x2="760" y2="312" stroke-dasharray="2 6"/>
  </g>

  <!-- Corner Registration Crosshairs (+) -->
  <g stroke="#52525b" stroke-width="1" opacity="0.7">
    <path d="M556 48 H564 M560 44 V52"/>
    <path d="M556 312 H564 M560 308 V316"/>
    <path d="M956 48 H964 M960 44 V52"/>
    <path d="M36 48 H44 M40 44 V52"/>
  </g>

  <!-- Top Telemetry Bar (Row 00) -->
  <g transform="translate(40, 29)">
    <circle cx="5" cy="-3.5" r="3" fill="#f97316" class="signal-dot"/>
    <text x="16" y="0" class="mono-accent">ALKAID // STUDIO &amp; SYSTEMS</text>
    <text x="240" y="0" class="mono-meta">INDEX 00 — PROFILE MANIFESTO</text>
    <text x="920" y="0" text-anchor="end" class="mono-meta">η UMa · 49.31° N, 13.79° E</text>
  </g>

  <!-- Left Column: Editorial Narrative & Value Proposition -->
  <g transform="translate(40, 108)">
    <text x="0" y="0" class="hero-title">FULL-STACK</text>
    <text x="0" y="46" class="hero-title">ARCHITECTURE <tspan class="hero-title-accent">&amp; CRAFT.</tspan></text>

    <!-- Subtle Divider Accent -->
    <rect x="0" y="68" width="36" height="2" fill="#f97316"/>
    <rect x="42" y="68" width="120" height="1" fill="#27272a"/>

    <!-- Core Positioning (Highlighting Full-Stack & Cross-Platform Depth) -->
    <text x="0" y="100" class="hero-zh">深耕 React / Vue 底层机理、Go / FastAPI 高并发服务端与多端工程化底座。</text>
    <text x="0" y="124" class="hero-en">Engineering deterministic systems across Frontend Internals, Distributed Backends,</text>
    <text x="0" y="142" class="hero-en">Cross-Platform Clients (Tauri / Flutter), and Autonomous AI Agent Infrastructure.</text>
  </g>

  <!-- Right Column: Precision Optical Instrument / Ursa Major Celestial Mechanics -->
  <g>
    <!-- Concentric Optical Rings around Alkaid / Ursa Major -->
    <circle cx="780" cy="180" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    <circle cx="780" cy="180" r="86" fill="none" stroke="#fb923c" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 6"/>
    <circle cx="882" cy="214" r="46" fill="none" stroke="#f97316" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="882" cy="214" r="24" fill="none" stroke="#fdba74" stroke-opacity="0.25" stroke-width="0.75" stroke-dasharray="2 3"/>

    <!-- Subtle Technical Axis Lines inside the Celestial Viewport -->
    <line x1="600" y1="180" x2="960" y2="180" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    <line x1="882" y1="70" x2="882" y2="290" stroke="#fb923c" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Ambient Deep-Field Micro Stars -->
    <g fill="#a1a1aa" opacity="0.35">
      <circle cx="605" cy="92" r="1"/>
      <circle cx="650" cy="255" r="0.8"/>
      <circle cx="725" cy="88" r="1.1"/>
      <circle cx="835" cy="96" r="0.9"/>
      <circle cx="935" cy="120" r="1"/>
      <circle cx="795" cy="268" r="0.8"/>
      <circle cx="942" cy="272" r="1"/>
    </g>

    <!-- Big Dipper (Ursa Major) Precision Vector Geometry -->
    <g class="orbit-slow" stroke="url(#constellation-stroke)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-bloom)">
      <!-- Bowl -->
      <line x1="618" y1="122" x2="626" y2="192"/>
      <line x1="626" y1="192" x2="712" y2="202"/>
      <line x1="712" y1="202" x2="722" y2="142"/>
      <line x1="722" y1="142" x2="618" y2="122" stroke-opacity="0.35" stroke-dasharray="2 3"/>
      <!-- Handle leading to Alkaid -->
      <line x1="722" y1="142" x2="782" y2="132"/>
      <line x1="782" y1="132" x2="838" y2="152"/>
      <line x1="838" y1="152" x2="882" y2="214"/>
    </g>

    <!-- Star Nodes (01 Dubhe -> 07 Alkaid) -->
    <g filter="url(#soft-bloom)">
      <!-- 01 Dubhe -->
      <circle cx="618" cy="122" r="8" fill="url(#node-glow)"/>
      <circle cx="618" cy="122" r="2.2" fill="#f4f4f5"/>
      <text x="618" y="109" text-anchor="middle" class="star-tag">α DUBHE</text>

      <!-- 02 Merak -->
      <circle cx="626" cy="192" r="7" fill="url(#node-glow)"/>
      <circle cx="626" cy="192" r="2" fill="#e4e4e7"/>
      <text x="626" y="210" text-anchor="middle" class="star-tag">β MERAK</text>

      <!-- 03 Phecda -->
      <circle cx="712" cy="202" r="7" fill="url(#node-glow)"/>
      <circle cx="712" cy="202" r="2" fill="#e4e4e7"/>
      <text x="712" y="220" text-anchor="middle" class="star-tag">γ PHECDA</text>

      <!-- 04 Megrez -->
      <circle cx="722" cy="142" r="6.5" fill="url(#node-glow)"/>
      <circle cx="722" y="142" r="1.8" fill="#d4d4d8"/>

      <!-- 05 Alioth -->
      <circle cx="782" cy="132" r="9" fill="url(#node-glow)"/>
      <circle cx="782" cy="132" r="2.4" fill="#ffffff"/>
      <text x="782" y="118" text-anchor="middle" class="star-tag">ε ALIOTH</text>

      <!-- 06 Mizar -->
      <circle cx="838" cy="152" r="8.5" fill="url(#node-glow)"/>
      <circle cx="838" cy="152" r="2.3" fill="#ffffff"/>
      <text x="852" y="142" text-anchor="start" class="star-tag">ζ MIZAR</text>

      <!-- 07 ALKAID (The Focal Supernova / Primary Identity Node) -->
      <circle cx="882" cy="214" r="22" fill="url(#alkaid-core)"/>
      <circle cx="882" cy="214" r="5.5" fill="#fb923c" opacity="0.45"/>
      <circle cx="882" cy="214" r="3.2" fill="#ffffff"/>
      <text x="882" y="246" text-anchor="middle" class="alkaid-tag">07 · η ALKAID [摇光]</text>
    </g>

    <!-- Viewport Telemetry Overlay -->
    <text x="580" y="74" class="mono-meta">OPTICAL STAGE // URSA MAJOR</text>
    <text x="960" y="294" text-anchor="end" class="mono-meta">LUM: 1.85 MAG · B3V</text>
  </g>

  <!-- Bottom 4-Column Architectural Spec Bar (Row 01-04) -->
  <g transform="translate(0, 312)">
    <!-- Dividers -->
    <line x1="250" y1="0" x2="250" y2="68" stroke="#ffffff" stroke-opacity="0.04"/>
    <line x1="500" y1="0" x2="500" y2="68" stroke="#ffffff" stroke-opacity="0.04"/>
    <line x1="750" y1="0" x2="750" y2="68" stroke="#ffffff" stroke-opacity="0.04"/>

    <!-- Pillar 01 -->
    <g transform="translate(40, 26)">
      <text x="0" y="0" class="spec-index">01 // FRONTEND CORE</text>
      <text x="0" y="19" class="spec-label">React Fiber · Vue 3 · Next.js</text>
    </g>

    <!-- Pillar 02 -->
    <g transform="translate(278, 26)">
      <text x="0" y="0" class="spec-index">02 // CROSS-PLATFORM</text>
      <text x="0" y="19" class="spec-label">Tauri 2 · Flutter · Electron · uni-app</text>
    </g>

    <!-- Pillar 03 -->
    <g transform="translate(528, 26)">
      <text x="0" y="0" class="spec-index">03 // SYSTEMS &amp; BACKEND</text>
      <text x="0" y="19" class="spec-label">Go (Gin) · FastAPI · PostgreSQL · Redis</text>
    </g>

    <!-- Pillar 04 -->
    <g transform="translate(778, 26)">
      <text x="0" y="0" class="spec-index">04 // AI INFRASTRUCTURE</text>
      <text x="0" y="19" class="spec-label">LangGraph · CLI Agents · TTY Router</text>
    </g>
  </g>
</svg>
