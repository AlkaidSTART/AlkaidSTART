<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14"/>
      <stop offset="45%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Star Glow Gradients -->
    <radialGradient id="alkaid-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .twinkle-fast { animation: twinkle 2.4s infinite ease-in-out; }
      .twinkle-med  { animation: twinkle 3.8s infinite ease-in-out; }
      .twinkle-slow { animation: twinkle 5.2s infinite ease-in-out; }
      .pulse-alkaid { animation: pulseAlkaid 3s infinite ease-in-out; transform-origin: 705px 165px; }
      .ripple       { animation: rippleWave 3s infinite ease-out; transform-origin: 705px 165px; }
      .ripple-delay { animation: rippleWave 3s infinite ease-out 1.5s; transform-origin: 705px 165px; }
      .line-pulse   { animation: lineGlow 4s infinite ease-in-out; }

      @keyframes twinkle {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 0.95; transform: scale(1.2); }
      }

      @keyframes pulseAlkaid {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.18); opacity: 1; }
      }

      @keyframes rippleWave {
        0% { transform: scale(0.4); opacity: 0.8; stroke-width: 1.5; }
        100% { transform: scale(2.4); opacity: 0; stroke-width: 0.2; }
      }

      @keyframes lineGlow {
        0%, 100% { stroke-opacity: 0.35; stroke-dashoffset: 0; }
        50% { stroke-opacity: 0.85; stroke-dashoffset: 20; }
      }

      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #94a3b8;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: url(#text-grad);
      }
      .text-motto {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .text-coord {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 9.5px;
        letter-spacing: 1px;
        fill: #475569;
      }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="840" height="260" rx="16" fill="url(#bg-grad)"/>
  <rect width="840" height="260" rx="16" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Subtle Coordinate Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.12" stroke-width="0.8" stroke-dasharray="3 6">
    <line x1="40" y1="65" x2="800" y2="65"/>
    <line x1="40" y1="130" x2="800" y2="130"/>
    <line x1="40" y1="195" x2="800" y2="195"/>
    <line x1="200" y1="20" x2="200" y2="240"/>
    <line x1="420" y1="20" x2="420" y2="240"/>
    <line x1="640" y1="20" x2="640" y2="240"/>
  </g>

  <!-- Ambient Cosmic Dust / Stars -->
  <g>
    <circle cx="85" cy="45" r="1" fill="#ffffff" class="twinkle-fast"/>
    <circle cx="160" cy="190" r="1.2" fill="#bae6fd" class="twinkle-med"/>
    <circle cx="230" cy="70" r="0.8" fill="#ffffff" class="twinkle-slow"/>
    <circle cx="310" cy="220" r="1.1" fill="#e0e7ff" class="twinkle-fast"/>
    <circle cx="370" cy="40" r="0.9" fill="#ffffff" class="twinkle-med"/>
    <circle cx="500" cy="210" r="1" fill="#bae6fd" class="twinkle-slow"/>
    <circle cx="610" cy="50" r="1.3" fill="#ffffff" class="twinkle-fast"/>
    <circle cx="770" cy="85" r="0.8" fill="#e0e7ff" class="twinkle-med"/>
    <circle cx="790" cy="205" r="1" fill="#ffffff" class="twinkle-slow"/>
    <circle cx="110" cy="130" r="0.7" fill="#ffffff" class="twinkle-med"/>
    <circle cx="480" cy="75" r="0.8" fill="#ffffff" class="twinkle-fast"/>
  </g>

  <!-- Big Dipper (北斗七星) Constellation Lines -->
  <!-- Coordinates:
       Dubhe(130, 75)
       Merak(140, 165)
       Phecda(270, 175)
       Megrez(285, 100)
       Alioth(420, 85)
       Mizar(555, 105)
       Alkaid(705, 165)
  -->
  <g class="line-pulse" stroke="url(#line-grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#bloom)">
    <!-- Spoon Bowl -->
    <line x1="130" y1="75" x2="140" y2="165"/>
    <line x1="140" y1="165" x2="270" y2="175"/>
    <line x1="270" y1="175" x2="285" y2="100"/>
    <line x1="285" y1="100" x2="130" y2="75"/>
    <!-- Spoon Handle -->
    <line x1="285" y1="100" x2="420" y2="85"/>
    <line x1="420" y1="85" x2="555" y2="105"/>
    <line x1="555" y1="105" x2="705" y2="165"/>
  </g>

  <!-- Stars 1 to 6 (天枢、天璇、天玑、天权、玉衡、开阳) -->
  <g filter="url(#bloom)">
    <!-- Dubhe 天枢 -->
    <circle cx="130" cy="75" r="14" fill="url(#star-glow)"/>
    <circle cx="130" cy="75" r="3.2" fill="#ffffff"/>
    <text x="130" y="60" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">天枢 · Dubhe</text>

    <!-- Merak 天璇 -->
    <circle cx="140" cy="165" r="13" fill="url(#star-glow)"/>
    <circle cx="140" cy="165" r="3" fill="#ffffff"/>
    <text x="140" y="185" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">天璇 · Merak</text>

    <!-- Phecda 天玑 -->
    <circle cx="270" cy="175" r="13" fill="url(#star-glow)"/>
    <circle cx="270" cy="175" r="3" fill="#ffffff"/>
    <text x="270" y="195" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">天玑 · Phecda</text>

    <!-- Megrez 天权 -->
    <circle cx="285" cy="100" r="12" fill="url(#star-glow)"/>
    <circle cx="285" cy="100" r="2.8" fill="#ffffff"/>
    <text x="285" y="85" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">天权 · Megrez</text>

    <!-- Alioth 玉衡 -->
    <circle cx="420" cy="85" r="15" fill="url(#star-glow)"/>
    <circle cx="420" cy="85" r="3.5" fill="#ffffff"/>
    <text x="420" y="70" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">玉衡 · Alioth</text>

    <!-- Mizar 开阳 -->
    <circle cx="555" cy="105" r="15" fill="url(#star-glow)"/>
    <circle cx="555" cy="105" r="3.4" fill="#ffffff"/>
    <text x="555" y="90" text-anchor="middle" font-size="9" fill="#94a3b8" font-family="sans-serif">开阳 · Mizar</text>
  </g>

  <!-- Star 7: ALKAID (摇光 · 破军之光) - Master Featured Star -->
  <g>
    <!-- Radiating Energy Ripples -->
    <circle cx="705" cy="165" r="24" fill="none" stroke="#38bdf8" class="ripple"/>
    <circle cx="705" cy="165" r="24" fill="none" stroke="#818cf8" class="ripple-delay"/>

    <!-- Large Aura Glow -->
    <circle cx="705" cy="165" r="42" fill="url(#alkaid-glow)" class="pulse-alkaid"/>

    <!-- Celestial Orbit Ring -->
    <circle cx="705" cy="165" r="20" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

    <!-- High Luminosity Core -->
    <circle cx="705" cy="165" r="5.2" fill="#ffffff" filter="url(#bloom)"/>
    <circle cx="705" cy="165" r="2" fill="#e0f2fe"/>

    <!-- Label for Alkaid -->
    <text x="705" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#38bdf8" font-family="sans-serif" filter="url(#bloom)">摇光 · Alkaid</text>
    <text x="705" y="208" text-anchor="middle" font-size="9" fill="#0284c7" font-family="monospace">η UMa · 15,500K</text>
  </g>

  <!-- Typography & Identity Block -->
  <g transform="translate(42, 218)">
    <text x="0" y="0" class="text-title">ALKAID</text>
    <text x="135" y="-3" class="text-sub">/ 北斗之末 · 开阳之伴</text>
    <text x="430" y="-3" class="text-motto">“Gaze at the stars, yet stay grounded.”</text>
    <text x="760" y="-3" class="text-coord" text-anchor="end">RA 13h 47m / Dec +49° 18′</text>
  </g>

</svg>
