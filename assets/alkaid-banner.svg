<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <radialGradient id="ambient" cx="78%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#9a3412" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="alkaid-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fed7aa" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="dipper-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#fb923c" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.9"/>
    </linearGradient>

    <style>
      .eyebrow {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        font-size: 10.5px;
        letter-spacing: 2.5px;
        fill: #fb923c;
        font-weight: 600;
      }
      .title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
        font-size: 38px;
        font-weight: 700;
        letter-spacing: -1px;
        fill: #fafafa;
      }
      .subtitle {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #a1a1aa;
      }
      .quote {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #52525b;
      }
      .star-label {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;
        font-size: 9.5px;
        letter-spacing: 1.5px;
        fill: #fdba74;
      }
      .pulse {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.45; }
      }
    </style>
  </defs>

  <!-- Minimalist Dark Canvas -->
  <rect width="1000" height="240" rx="12" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="12" fill="url(#ambient)"/>
  <rect x="0.5" y="0.5" width="999" height="239" rx="11.5" fill="none" stroke="#18181b" stroke-width="1"/>

  <!-- Left: Clean Typography -->
  <g transform="translate(52, 68)">
    <text x="0" y="0" class="eyebrow">η URSAE MAJORIS · 摇光</text>
    <text x="0" y="48" class="title">Hi, I'm Alkaid</text>
    <text x="0" y="84" class="subtitle">Full-Stack Developer &amp; AI Agent Builder · 仰望星空，脚踏实地</text>
    <text x="0" y="116" class="quote">// Building CLI Coding Agents, Cross-Platform Apps &amp; High-Concurrency Systems</text>
  </g>

  <!-- Right: Minimalist Big Dipper (Ursa Major) -->
  <g transform="translate(20, -10)">
    <!-- Subtle Orbit Ring around Alkaid -->
    <circle cx="882" cy="166" r="32" fill="none" stroke="#fb923c" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="2 4"/>

    <!-- Constellation Lines -->
    <g stroke="url(#dipper-line)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
      <line x1="640" y1="86" x2="648" y2="146"/>
      <line x1="648" y1="146" x2="724" y2="154"/>
      <line x1="724" y1="154" x2="732" y2="104"/>
      <line x1="732" y1="104" x2="640" y2="86" stroke-opacity="0.25" stroke-dasharray="2 3"/>
      <line x1="732" y1="104" x2="788" y2="94"/>
      <line x1="788" y1="94" x2="840" y2="112"/>
      <line x1="840" y1="112" x2="882" y2="166"/>
    </g>

    <!-- 6 Dipper Stars -->
    <g fill="#e4e4e7">
      <circle cx="640" cy="86" r="2"/>
      <circle cx="648" cy="146" r="1.8" opacity="0.8"/>
      <circle cx="724" cy="154" r="1.8" opacity="0.8"/>
      <circle cx="732" cy="104" r="1.6" opacity="0.7"/>
      <circle cx="788" cy="94" r="2.2"/>
      <circle cx="840" cy="112" r="2.1"/>
    </g>

    <!-- 07 Alkaid (Primary Star) -->
    <circle cx="882" cy="166" r="18" fill="url(#alkaid-glow)" class="pulse"/>
    <circle cx="882" cy="166" r="3" fill="#ffffff"/>
    <text x="882" y="198" text-anchor="middle" class="star-label">ALKAID</text>
  </g>
</svg>
