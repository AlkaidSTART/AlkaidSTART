<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 346" width="100%" height="100%">
  <defs>
    <linearGradient id="spec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="top-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <style>
      .sec-idx { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 2px; fill: #fb923c; }
      .sec-meta { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; letter-spacing: 1.8px; fill: #52525b; }
      .row-id { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; fill: #fb923c; }
      .row-en { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; font-size: 12.5px; font-weight: 700; letter-spacing: 0.2px; fill: #e4e4e7; }
      .row-zh { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 11.5px; fill: #71717a; }
      .tag-box { fill: #111115; stroke: #232329; stroke-width: 1; }
      .tag-box-hi { fill: #1a110b; stroke: #7c2d12; stroke-width: 1; }
      .tag-txt { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; fill: #d4d4d8; }
      .tag-txt-hi { font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace; font-size: 10.5px; font-weight: 600; fill: #fdba74; }
    </style>
  </defs>

  <!-- Section Header -->
  <g transform="translate(4, 18)">
