    <line x1="226" y1="-4" x2="720" y2="-4" stroke="#18181b" stroke-width="1"/>
    <text x="992" y="0" text-anchor="end" class="sec-meta">SYSTEM ARCHITECTURE &amp; TOOLING</text>
  </g>

  <!-- Specification Sheet Frame -->
