        <rect x="230" y="0" width="70" height="25" rx="4" class="tag-box"/>
        <text x="265" y="16.5" text-anchor="middle" class="tag-txt">uni-app</text>

        <rect x="308" y="0" width="72" height="25" rx="4" class="tag-box"/>
