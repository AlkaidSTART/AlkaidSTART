        <rect x="98" y="0" width="60" height="25" rx="4" class="tag-box"/>
        <text x="128" y="16.5" text-anchor="middle" class="tag-txt">Vue 3</text>

        <rect x="166" y="0" width="66" height="25" rx="4" class="tag-box"/>
        <text x="199" y="16.5" text-anchor="middle" class="tag-txt">Next.js</text>

        <rect x="240" y="0" width="106" height="25" rx="4" class="tag-box"/>
        <text x="293" y="16.5" text-anchor="middle" class="tag-txt">TanStack Query</text>

        <rect x="354" y="0" width="68" height="25" rx="4" class="tag-box"/>
        <text x="388" y="16.5" text-anchor="middle" class="tag-txt">Zustand</text>

        <rect x="430" y="0" width="76" height="25" rx="4" class="tag-box"/>
