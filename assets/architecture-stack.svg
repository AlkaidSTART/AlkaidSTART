      <text x="24" y="45" class="row-en">AI &amp; Cloud Infra</text>
      <text x="245" y="36" class="row-zh">智能体编排与基建</text>
      <g transform="translate(365, 18)">
        <rect x="0" y="0" width="84" height="25" rx="4" class="tag-box-hi"/>
        <text x="42" y="16.5" text-anchor="middle" class="tag-txt-hi">LangGraph</text>

        <rect x="92" y="0" width="82" height="25" rx="4" class="tag-box"/>
        <text x="133" y="16.5" text-anchor="middle" class="tag-txt">LangChain</text>

        <rect x="182" y="0" width="92" height="25" rx="4" class="tag-box"/>
        <text x="228" y="16.5" text-anchor="middle" class="tag-txt">Claude Code</text>

        <rect x="282" y="0" width="62" height="25" rx="4" class="tag-box"/>
        <text x="313" y="16.5" text-anchor="middle" class="tag-txt">Codex</text>

