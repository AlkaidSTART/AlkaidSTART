    <rect x="0.5" y="0.5" width="999" height="304" rx="11.5" fill="none" stroke="#1f1f23" stroke-width="1"/>
    <line x1="24" y1="1" x2="976" y2="1" stroke="url(#top-line)" stroke-width="1"/>

