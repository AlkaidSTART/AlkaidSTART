  <path d="M 342.0,22.0 v 5.1 M 366.0,22.0 v 3.0 M 390.0,22.0 v 3.0 M 414.0,22.0 v 3.0 M 438.0,22.0 v 3.0 M 462.0,22.0 v 5.1 M 486.0,22.0 v 3.0 M 510.0,22.0 v 3.0 M 534.0,22.0 v 3.0 M 558.0,22.0 v 3.0 M 582.0,22.0 v 5.1 M 606.0,22.0 v 3.0 M 630.0,22.0 v 3.0 M 654.0,22.0 v 3.0 M 678.0,22.0 v 3.0 M 702.0,22.0 v 5.1 M 726.0,22.0 v 3.0 M 750.0,22.0 v 3.0 M 774.0,22.0 v 3.0 M 798.0,22.0 v 3.0 M 822.0,22.0 v 5.1" fill="none" stroke="#3D3D47" stroke-width="0.7" stroke-opacity="0.55" />
  <g stroke="#3D3D47" stroke-width="0.85" stroke-opacity="0.85"><line x1="322.8" y1="22.0" x2="329.2" y2="22.0" /><line x1="326.0" y1="18.8" x2="326.0" y2="25.2" /></g>
  <g stroke="#3D3D47" stroke-width="0.85" stroke-opacity="0.85"><line x1="838.8" y1="22.0" x2="845.2" y2="22.0" /><line x1="842.0" y1="18.8" x2="842.0" y2="25.2" /></g>

  <!-- Animated Travelling Particle Pulse -->
