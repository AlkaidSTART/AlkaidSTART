<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 44" width="100%" height="100%" role="img" aria-label="01 ARCHITECTURE &amp; SYSTEM TOPOLOGY">
  <defs>
    <linearGradient id="div-glint-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAFAFA" stop-opacity="0" />
      <stop offset="50%" stop-color="#FAFAFA" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FAFAFA" stop-opacity="0" />
    </linearGradient>
    <clipPath id="div-rail-01">
      <rect x="326" y="19" width="516" height="6" />
    </clipPath>
    <style>
      .div-idx { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px; fill: #FAFAFA; }
      .div-title { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; letter-spacing: 1.8px; fill: #A1A1AA; }
      .div-code { font-family: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 1.4px; fill: #71717A; }
      .div-pulse { animation: divGlide 6.5s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      @keyframes divGlide {
        0% { transform: translateX(236px); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateX(862px); opacity: 0; }
      }
    </style>
  </defs>

