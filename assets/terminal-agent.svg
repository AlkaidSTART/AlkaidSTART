<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 210" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="term-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151b2b"/>
      <stop offset="100%" stop-color="#101524"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', Consolas, Monaco, 'Fira Code', Menlo, monospace; }
      .cursor { animation: blink 1s infinite steps(1); }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Surface -->
  <rect width="840" height="210" rx="14" fill="url(#term-bg)"/>
  <rect width="840" height="210" rx="14" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Window Header -->
  <path d="M0,14 C0,6.27 6.27,0 14,0 L826,0 C833.73,0 840,6.27 840,14 L840,38 L0,38 Z" fill="url(#term-header)"/>
  <line x1="0" y1="38" x2="840" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- macOS Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#ef4444"/>
  <circle cx="44" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="64" cy="19" r="6" fill="#10b981"/>

  <!-- Header Title -->
  <text x="420" y="23" text-anchor="middle" font-size="12" fill="#64748b" class="mono">alkaid@cyber-observatory: ~/call-code-agent</text>

  <!-- Terminal Body Content -->
  <!-- Prompt 1 -->
  <g transform="translate(28, 62)" class="mono" font-size="12.5">
    <text x="0" y="0" fill="#38bdf8">❯</text>
    <text x="16" y="0" fill="#f8fafc">alkaid</text>
    <text x="75" y="0" fill="#a78bfa">--status</text>
    <text x="145" y="0" fill="#64748b">--focus=creation</text>
  </g>

  <!-- Response Lines -->
  <g transform="translate(28, 88)" class="mono" font-size="12">
    <!-- Line 1 -->
    <text x="16" y="0" fill="#38bdf8">╭─</text>
    <text x="40" y="0" fill="#94a3b8">Codename</text>
    <text x="125" y="0" fill="#475569">:</text>
    <text x="145" y="0" fill="#38bdf8" font-weight="bold">Alkaid</text>
    <text x="210" y="0" fill="#64748b">(摇光 · 北斗之末 · 破军星)</text>
    <text x="460" y="0" fill="#475569">|</text>
    <text x="480" y="0" fill="#94a3b8">Location :</text>
    <text x="560" y="0" fill="#f8fafc">Chengdu, CN 📍</text>

    <!-- Line 2 -->
    <text x="16" y="22" fill="#38bdf8">├─</text>
    <text x="40" y="22" fill="#94a3b8">Domain</text>
    <text x="125" y="22" fill="#475569">:</text>
    <text x="145" y="22" fill="#f8fafc">React &amp; Vue</text>
    <text x="245" y="22" fill="#475569">·</text>
    <text x="260" y="22" fill="#00add8">Go (Gin)</text>
    <text x="330" y="22" fill="#475569">·</text>
    <text x="345" y="22" fill="#38bdf8">Python (FastAPI)</text>

    <!-- Line 3 -->
    <text x="16" y="44" fill="#38bdf8">├─</text>
    <text x="40" y="44" fill="#94a3b8">AI Stack</text>
    <text x="125" y="44" fill="#475569">:</text>
    <text x="145" y="44" fill="#34d399">LangGraph</text>
    <text x="235" y="44" fill="#475569">·</text>
    <text x="250" y="44" fill="#a78bfa">LangChain</text>
    <text x="335" y="44" fill="#475569">·</text>
    <text x="350" y="44" fill="#c084fc">call-code (Ink CLI)</text>

    <!-- Line 4 -->
    <text x="16" y="66" fill="#38bdf8">╰─</text>
    <text x="40" y="66" fill="#94a3b8">Mission</text>
    <text x="125" y="66" fill="#475569">:</text>
    <text x="145" y="66" fill="#fbbf24">“持续把脑海中野生有趣的想法，敲成可触摸的现实 ✨”</text>
  </g>

  <!-- Interactive Prompt Line with Blinking Cursor -->
  <g transform="translate(28, 182)" class="mono" font-size="12.5">
    <text x="0" y="0" fill="#10b981">❯</text>
    <text x="16" y="0" fill="#34d399">ready</text>
    <text x="65" y="0" fill="#475569">to explore constellation?</text>
    <rect x="255" y="-11" width="8" height="15" fill="#38bdf8" class="cursor"/>
  </g>

</svg>
